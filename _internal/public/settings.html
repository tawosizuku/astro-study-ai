<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設定 | Astro学習支援AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Astro学習支援AI</span>
  </div>
  <nav class="mainnav" aria-label="ページ切替">
    <a href="index.html">ホーム</a>
    <a href="roadmap.html">学習の道のり</a>
    <a href="notebook.html">苦手ノート</a>
    <a href="glossary.html">用語集</a>
    <a href="settings.html" class="active" aria-current="page">設定</a>
  </nav>
</header>

<main class="page">
  <section class="hero hero-slim">
    <h1 class="hero-title">設定</h1>
    <p class="hero-sub">採点に使うAIの設定です。いずれもこのブラウザの中だけに保存され、サーバーには送られません。</p>
  </section>

  <div class="duo">
    <section class="card" id="gemini-section" aria-labelledby="gemini-heading">
      <h2 id="gemini-heading" class="card-label card-label--plain">Gemini APIキー</h2>
      <p class="empty-note">学習画面の採点に使います。<a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener">Google AI Studio</a>で無料発行できます。</p>
      <div class="settings-row">
        <input id="settings-gemini-key" type="password" placeholder="Gemini APIキー" aria-label="Gemini APIキー" />
        <button type="button" id="gemini-key-toggle" class="btn btn-ghost btn-sm">表示</button>
        <button type="button" id="gemini-key-clear" class="btn btn-ghost btn-sm">削除</button>
      </div>
      <p id="gemini-key-status" class="status" role="status"></p>
    </section>

    <section class="card" id="claude-section" aria-labelledby="claude-heading">
      <h2 id="claude-heading" class="card-label card-label--plain">Claude Code 連携</h2>
      <p class="empty-note">
        お使いのPCに<a href="https://docs.claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a>がインストール・ログイン済みなら、
        Gemini APIキーの代わりにそちらで採点できます。
      </p>
      <div id="claude-status" class="claude-status claude-status--pending">
        <span class="claude-status__dot" aria-hidden="true"></span>
        <span id="claude-status-text">確認中…</span>
      </div>
      <div class="claude-setup-guide" id="claude-setup-guide" hidden></div>
      <button type="button" id="claude-recheck-btn" class="btn btn-ghost btn-sm">再チェック</button>

      <label class="settings-toggle-row" id="use-claude-default-row">
        <input id="settings-use-claude" type="checkbox" />
        <span>学習画面でも既定でClaudeを使う</span>
      </label>
      <p class="empty-note">学習画面の右上にある「Claudeで採点」チェックとこの設定は連動しています。</p>
    </section>
  </div>
</main>

<script src="common.js"></script>
<script src="auth.js"></script>
<script src="settings.js"></script>
</body>
</html>
